# รันทั้งระบบด้วยคำสั่งเดียว: docker compose up
# db = MySQL, phpmyadmin = ดูตาราง, backend = Express API, frontend = Vue (Vite)
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: bpes
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backups:/backup
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot1234"]
      interval: 5s
      retries: 30

  phpmyadmin:
    image: phpmyadmin:5
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root1234
    ports:
      - "8080:80"
    depends_on:
      - db

  backend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run seed && npm run dev"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root1234
      DB_NAME: bpes
      PORT: 3301
      JWT_SECRET: bpes-2568-change-this-to-a-long-random-secret-key
    ports:
      - "3301:3301"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      API_URL: http://backend:3301
    ports:
      - "5175:5175"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  db_data:
